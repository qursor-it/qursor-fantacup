# Token emessi da Next (GET /api/stories/token), firmati RS256 con STORIES_JWT_PRIVATE_KEY.
# Quarkus scarica la chiave pubblica dal JWKS di Next e la tiene in cache: verifica, non emette.
mp.jwt.verify.publickey.location=${STORIES_JWKS_URL}
mp.jwt.verify.issuer=qursor-fantacup
mp.jwt.verify.audiences=stories
smallrye.jwt.path.groups=groups

# Dev: Next locale (con STORIES_JWT_PRIVATE_KEY = dev-keys/privateKey.pem). Test: la coppia in dev-keys/, mai in produzione.
%dev.mp.jwt.verify.publickey.location=http://localhost:3000/api/stories/jwks
%test.mp.jwt.verify.publickey.location=dev-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=dev-keys/privateKey.pem

# Il browser chiama Quarkus da un'altra origine (l'app Next).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${STORIES_CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PUT,DELETE
